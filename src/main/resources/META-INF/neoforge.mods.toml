modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/gottsch/gottsch-minecraft-MobDiceAttributes/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
updateJSONURL="https://raw.githubusercontent.com/gottsch/gottsch-minecraft-MobDiceAttributes/neoforge-1.21.1-main/update.json"
logoFile="${mod_id}.png"
credits=""
authors="${mod_authors}"
description='''A Minecraft mod that converts base mod attribute values using RPG dice mechanics.'''

[[dependencies.mobdiceattribs]]
    modId="neoforge"
    mandatory=true
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="SERVER"

[[dependencies.mobdiceattribs]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="SERVER"

[[dependencies.mobdiceattribs]]
    modId="gottschcore"
    mandatory=true
    versionRange="[2.1.0,]"
    ordering="BEFORE"
    side="SERVER"
